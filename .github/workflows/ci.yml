name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  # issue-loop merges on this check (TEST_CHECK=test), so it carries all of quality.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
