# Settings for issue-loop, which works through this repo's ready-for-agent issues unattended.
# Run it with `issue-loop --dry-run` first; see the script's header for everything else.

SETUP='npm ci --silent'

# Playwright needs browsers and a local server, so the e2e suite runs in CI only, where
# TEST_CHECK gates the merge on it.
TEST='ASTRO_TELEMETRY_DISABLED=1 npm run format:check && ASTRO_TELEMETRY_DISABLED=1 npm run check && npm test'

TEST_CHECK=test

MERGE=squash

# Work lands on dev first; main only fast-forwards to it (see AGENTS.md).
BASE=dev

# The tests need nothing from the network once SETUP has run.
NETWORK=''

NEVER_RUN='deploys, DNS changes or anything against Cloudflare, Porkbun or AdSense'
NEVER_RUN_WHY='the site is deployed by Cloudflare from main; the maintainer handles accounts by hand'

AUDIENCE='Salesforce admins and developers using the site'
AUDIENCE_SEES='the pages at tools.salesforceway.com: tools, their wording and the articles'
